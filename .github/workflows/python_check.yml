name: LaunchSentiment Code Quality Check

on:
    push:
        branches: [main]

jobs:
    code-quality:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with: 
                python-version: '3.10'
            - name: Install Quality Tools
              run: |
                python -m pip install --upgrade pip
                pip install black flake8
            - name: Run Black Formatter Check
              run: black --check airflow/airflow-launchsentiment/
            - name: Run Flake8 Linter
              run: |
                flake8 airflow/airflow-launchsentiment/ --count --select=E9,F63,F7,F82 --show-source --statistics
                flake8 airflow/airflow-launchsentiment/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
